parent_guide:
  teach_me:
  - 6 ga ko‘paytirish — 6 tadan bo‘lgan bir xil guruhlarni sanash. Masalan, 3 × 6 — 3 ta guruh, har birida 6 tadan.
  - Jadvalni yodlatishdan oldin bola guruhlarni ko‘rib, sanab tushunishi muhim — shunda yodlash oson va mustahkam bo‘ladi.
  - 'Tekshirish usuli: ko‘paytmani 6 tadan sanab chiqing yoki ko‘paytuvchilar o‘rnini almashtirib ko‘ring.'
  teach_child:
  - minutes: 1–2
    action: Uydagi mayda buyumlardan (tugma, loviya, makaron) 6 tadan qilib 3 ta guruh tuzing.
  - minutes: 3–5
    action: Farzandingiz guruhlarni qo‘shib sanasin, keyin “3 × 6” deb yozsin.
  - minutes: 6–8
    action: Guruhlar sonini 4, 5, 6 taga o‘zgartiring. Har safar avval taxmin qilsin, keyin sanab tekshirsin.
  - minutes: 9–10
    action: 'O‘zi bitta masala o‘ylab topib, yechib bersin: “… ta likopchada 6 tadan …”.'
  materials:
  - 36 tagacha mayda buyum (tugma, loviya yoki makaron)
  - qog‘oz va qalam
  watch_for:
  - Qo‘shish va ko‘paytirishni adashtirishi
  - Sanashda shoshilishi
  - Jadvalni tushunmasdan yodlashga urinishi
