explanation:
  intro: Ko‘paytirish — bir xil sonlarni tez qo‘shish usuli.
  steps:
  - 3 ta likopchani tasavvur qil, har birida 6 tadan olma bor.
  - 6 + 6 + 6 = 18. Buni qisqacha 3 × 6 = 18 deb yozamiz.
  - '6 tadan sanab boramiz: 6, 12, 18, 24, 30 … — bu 6 ning ko‘paytirish jadvali.'
  - 'Ko‘paytuvchilar o‘rnini almashtirsak, natija o‘zgarmaydi: 3 × 6 = 6 × 3.'
  visual:
    type: groups
    a: 3
    b: 6
    item: olma
worked_example:
  prompt: 4 ta qutining har birida 6 tadan qalam bor. Hammasi bo‘lib nechta qalam bor?
  steps:
  - Guruhlar soni — 4 ta, har birida 6 tadan.
  - '4 × 6 ni topamiz: 6 + 6 + 6 + 6 = 24.'
  - 'Javob: 24 ta qalam.'
  answer: 24
