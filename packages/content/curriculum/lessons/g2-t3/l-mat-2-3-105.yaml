objective: Sonni 6 ga ko‘paytirishni (1 dan 10 gacha) teng guruhlar orqali tushunish va 6 ning ko‘paytirish jadvalini qo‘llay olish.
success_criteria:
- 6 tadan sanab borib, ko‘paytmani topa oladi.
- a × 6 ifodasini teng guruhlar rasmi bilan tushuntira oladi.
- 'O‘rin almashtirishdan foydalanadi: 6 × a = a × 6.'
- Yangi so‘zli masalada ko‘paytirish kerakligini o‘zi aniqlaydi.
