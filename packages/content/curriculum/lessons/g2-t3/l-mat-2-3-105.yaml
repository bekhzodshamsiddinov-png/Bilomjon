  remedy: Guruhlarni rasmda chizdirib, har birini qo‘shib chiqishni so‘rang.
- code: GROUP_COUNT_OFF
  description: 6 tadan sanab borishda bitta guruhni tashlab ketadi yoki ortiqcha qo‘shadi.
  remedy: Har bir qadamda bitta barmoqni bukib sanash.
- code: COUNTING_SLIP
  description: Qo‘shishda kichik xato qiladi (±1).
  remedy: Javobni boshqa usulda (o‘rin almashtirib) tekshirish.
