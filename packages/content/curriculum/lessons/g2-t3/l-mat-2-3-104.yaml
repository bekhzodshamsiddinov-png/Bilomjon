- ta kam
explanation:
  intro: “Marta kam” — hammasini teng qismlarga bo‘lib, bitta qismini olamiz.
  steps:
  - Savatda 12 ta olma bor. Qutida undan 3 marta kam olma bor.
  - 12 ta olmani 3 ta teng guruhga ajratamiz — har birida 4 ta.
  - 'Bitta guruh — qutidagi olmalar: 12 : 3 = 4.'
  - 'Diqqat: “3 ta kam” bo‘lsa — ayiramiz (12 − 3), “3 marta kam” bo‘lsa — bo‘lamiz (12 : 3).'
  visual:
    type: times
    a: 12
    b: 3
    item: olma
worked_example:
  prompt: Tokchada 15 ta kitob bor. Qutida undan 5 marta kam kitob bor. Qutida nechta kitob bor?
  steps:
  - “5 marta kam” — 15 ni 5 ta teng qismga bo‘lamiz.
  - '15 : 5 = 3, chunki 3 × 5 = 15.'
  - 'Javob: qutida 3 ta kitob.'
  answer: 3
misconceptions:
- code: SUB_INSTEAD_OF_TIMES
  description: “5 marta kam”ni “5 ta kam” deb, 15 − 5 = 10 deb hisoblaydi.
  remedy: Ikkala iborani buyumlar bilan yonma-yon solishtiring.
- code: WRONG_DIRECTION
  description: “Kam” bo‘lsa ham ko‘paytirib yuboradi.
  remedy: “Kam bo‘lsa — natija kichikroq bo‘lishi kerak” deb tekshirish.
