parent_guide:
  teach_me:
  - '“… marta kam” — bo‘lish: 12 ning 3 marta kami = 12 : 3 = 4.'
  - '“… ta kam” — ayirish: 12 dan 3 ta kam = 12 − 3 = 9.'
  - 'Tekshirish: kichik sonni necha martaga ko‘paytirsak, katta son chiqishi kerak (4 × 3 = 12).'
  teach_child:
  - minutes: 1–2
    action: 12 ta buyumni stolga qo‘ying. “Menda 12 ta. Senda 3 marta kam bo‘lsin” deb, 3 ta teng guruhga ajrattiring.
  - minutes: 3–5
    action: 'Bitta guruhni farzandingizga bering — u qancha bo‘lganini aytsin va “12 : 3 = 4” deb yozsin.'
  - minutes: 6–8
    action: '“3 ta kam” bilan solishtiring: 12 tadan 3 tasini oling. Qaysi biri ko‘proq qoldi?'
  - minutes: 9–10
    action: 'Javobini ko‘paytirish bilan tekshirsin: “4 × 3 = 12”.'
