objective: “… marta kam” iborasini bo‘lish bilan bog‘lash va sonni bir necha marta kamaytirishga doir masalalarni yechish.
success_criteria:
- “3 marta kam” — teng 3 qismga bo‘lib, bitta qismini olish ekanini tushuntira oladi.
- “… ta kam” (ayirish) va “… marta kam” (bo‘lish)ni farqlaydi.
- Natijani ko‘paytirish bilan tekshiradi.
prior_knowledge:
- 2, 3, 4, 5 ga bo‘lish
- “Marta ko‘p” masalalari
