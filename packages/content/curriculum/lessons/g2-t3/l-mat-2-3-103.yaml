parent_guide:
  teach_me:
  - '“… marta ko‘p” — ko‘paytirish: 4 ning 3 marta ko‘pi = 4 × 3 = 12.'
  - '“… ta ko‘p” — qo‘shish: 4 dan 3 ta ko‘p = 4 + 3 = 7. Bolalar ko‘pincha shu ikkisini adashtiradi.'
  - Eng yaxshi usul — ikkalasini buyumlar bilan yonma-yon ko‘rsatish.
  teach_child:
  - minutes: 1–2
    action: Stolga 3 ta qoshiq qo‘ying. “Menda 3 ta. Senda undan 2 marta ko‘p bo‘lsin” deb, farzandingizga 3 tadan 2 guruh tuzdiring.
  - minutes: 3–5
    action: Endi “2 ta ko‘p” deb ayting — u 3 ta qoshiqqa yana 2 ta qo‘shsin. Ikkala natijani solishtiring.
  - minutes: 6–8
    action: “Marta ko‘p” va “ta ko‘p” so‘zlarini aralashtirib 3–4 ta savol bering; har safar avval qaysi amal ekanini aytsin.
  - minutes: 9–10
    action: O‘zi “marta ko‘p” so‘zi bor bitta masala tuzib, yechib bersin.
  materials:
  - 20 tagacha qoshiq, qalam yoki boshqa buyum
  watch_for:
  - “marta” va “ta” so‘zlarini adashtirishi
  - Javobni tekshirmasligi
