objective: “… marta ko‘p” iborasini ko‘paytirish bilan bog‘lash va sonni bir necha marta orttirishga doir masalalarni yechish.
success_criteria:
- “3 marta ko‘p” — sonni 3 marta takrorlash, ya’ni 3 ga ko‘paytirish ekanini tushuntira oladi.
- “… ta ko‘p” (qo‘shish) va “… marta ko‘p” (ko‘paytirish)ni farqlaydi.
- Masalani to‘g‘ri amal bilan yechadi va javobini izohlaydi.
prior_knowledge:
- 2, 3, 4, 5 ning ko‘paytirish jadvali
- “… ta ko‘p” masalalari (qo‘shish)
vocabulary:
- marta ko‘p
- orttirish
- ta ko‘p
explanation:
  intro: “Marta ko‘p” — bir xil guruh bir necha marta takrorlanadi degani.
  steps:
  - Qutida 2 ta olma bor. Savatda undan 3 marta ko‘p olma bor.
  - 'Demak, savatda 2 tadan bo‘lgan 3 ta guruh bor: 2 + 2 + 2.'
  - 'Buni ko‘paytirish bilan yozamiz: 2 × 3 = 6. Savatda 6 ta olma.'
  - 'Diqqat: “3 ta ko‘p” bo‘lsa — qo‘shamiz (2 + 3), “3 marta ko‘p” bo‘lsa — ko‘paytiramiz (2 × 3).'
  visual:
    type: times
    a: 2
    b: 3
    item: olma
worked_example:
  prompt: Qutida 4 ta qalam bor. Xaltada undan 3 marta ko‘p qalam bor. Xaltada nechta qalam bor?
  steps:
  - “3 marta ko‘p” — 4 tadan 3 ta guruh.
  - 4 × 3 = 12.
  - 'Javob: xaltada 12 ta qalam.'
  answer: 12
misconceptions:
- code: ADD_INSTEAD_OF_TIMES
  description: “3 marta ko‘p”ni “3 ta ko‘p” deb tushunib, 4 + 3 = 7 deb hisoblaydi.
  remedy: Ikkala iborani yonma-yon buyumlar bilan ko‘rsatib solishtiring.
- code: WRONG_DIRECTION
  description: “Ko‘p” bo‘lsa ham bo‘lib yuboradi.
  remedy: “Ko‘p bo‘lsa — natija kattaroq bo‘lishi kerak” deb tekshirishni o‘rgating.
