objective: Sonni 8 ga ko‘paytirishni (1 dan 10 gacha) teng guruhlar orqali tushunish va 8 ning ko‘paytirish jadvalini qo‘llay olish.
success_criteria:
- 8 tadan sanab borib, ko‘paytmani topa oladi.
- a × 8 ifodasini teng guruhlar rasmi bilan tushuntira oladi.
- 'O‘rin almashtirishdan foydalanadi: 8 × a = a × 8.'
- Yangi so‘zli masalada ko‘paytirish kerakligini o‘zi aniqlaydi.
