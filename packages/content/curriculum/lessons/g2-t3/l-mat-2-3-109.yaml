explanation:
  intro: Ko‘paytirish — bir xil sonlarni tez qo‘shish usuli.
  steps:
  - 3 ta likopchani tasavvur qil, har birida 8 tadan olma bor.
  - 8 + 8 + 8 = 24. Buni qisqacha 3 × 8 = 24 deb yozamiz.
  - '8 tadan sanab boramiz: 8, 16, 24, 32, 40 … — bu 8 ning ko‘paytirish jadvali.'
  - 'Ko‘paytuvchilar o‘rnini almashtirsak, natija o‘zgarmaydi: 3 × 8 = 8 × 3.'
  visual:
    type: groups
    a: 3
    b: 8
    item: olma
worked_example:
  prompt: 4 ta qutining har birida 8 tadan qalam bor. Hammasi bo‘lib nechta qalam bor?
  steps:
  - Guruhlar soni — 4 ta, har birida 8 tadan.
  - '4 × 8 ni topamiz: 8 + 8 + 8 + 8 = 32.'
  - 'Javob: 32 ta qalam.'
  answer: 32
