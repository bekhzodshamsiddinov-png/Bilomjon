parent_guide:
  teach_me:
  - 8 ga ko‘paytirish — 8 tadan bo‘lgan bir xil guruhlarni sanash. Masalan, 3 × 8 — 3 ta guruh, har birida 8 tadan.
  - Jadvalni yodlatishdan oldin bola guruhlarni ko‘rib, sanab tushunishi muhim — shunda yodlash oson va mustahkam bo‘ladi.
  - 'Tekshirish usuli: ko‘paytmani 8 tadan sanab chiqing yoki ko‘paytuvchilar o‘rnini almashtirib ko‘ring.'
  teach_child:
  - minutes: 1–2
    action: Uydagi mayda buyumlardan (tugma, loviya, makaron) 8 tadan qilib 3 ta guruh tuzing.
  - minutes: 3–5
    action: Farzandingiz guruhlarni qo‘shib sanasin, keyin “3 × 8” deb yozsin.
  - minutes: 6–8
    action: Guruhlar sonini 4, 5, 6 taga o‘zgartiring. Har safar avval taxmin qilsin, keyin sanab tekshirsin.
  - minutes: 9–10
    action: 'O‘zi bitta masala o‘ylab topib, yechib bersin: “… ta likopchada 8 tadan …”.'
  materials:
  - 48 tagacha mayda buyum (tugma, loviya yoki makaron)
  - qog‘oz va qalam
  watch_for:
  - Qo‘shish va ko‘paytirishni adashtirishi
  - Sanashda shoshilishi
  - Jadvalni tushunmasdan yodlashga urinishi
