parent_guide:
  teach_me:
  - 'Bu chorak yakuni: farzandingiz butun ko‘paytirish jadvali va bo‘lishni bilishi kerak.'
  - Hisobotdagi “mashq kerak” deb belgilangan mavzularga qayting — har biriga 10 daqiqa yetarli.
  teach_child:
  - minutes: 1–3
    action: '“Jadval bingo”: 3×3 katak chizing, ko‘paytmalarni yozing; siz misol aytasiz, u javobni topib belgilaydi.'
  - minutes: 4–7
    action: Uydagi vaziyatdan 2 ta masala tuzing (dasturxon, bozor, o‘yinchoqlar).
  - minutes: 8–10
    action: Qaysi ko‘paytmalar hali qiyin ekanini birga yozib, muzlatgichga yopishtiring.
  materials:
  - qog‘oz va qalam
  watch_for:
  - 6–9 jadvallaridagi qiyinchilik
  - Bo‘lishni ko‘paytirish bilan tekshirmaslik
