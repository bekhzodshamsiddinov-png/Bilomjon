objective: 2–9 sonlarining ko‘paytirish va bo‘lish jadvalini hamda ularning bog‘liqligini mustaqil qo‘llash.
success_criteria:
- Jadval doirasidagi ko‘paytirish va bo‘lish misollarini yechadi.
- Ko‘paytirishdan bo‘lishni keltirib chiqaradi.
- So‘zli masalada amalni to‘g‘ri tanlaydi.
prior_knowledge:
