vocabulary:
- ko‘paytirish jadvali
- teskari amal
explanation:
  intro: Butun chorak davomida o‘rganganlarimizni takrorlaymiz.
  steps:
  - Ko‘paytirish — teng guruhlarni birlashtirish; bo‘lish — teng tarqatish.
  - 'Har bir ko‘paytirishdan ikkita bo‘lish chiqadi: 7 × 8 = 56 → 56 : 7 = 8, 56 : 8 = 7.'
  - Unutilgan ko‘paytmani yaqin ko‘paytmadan topamiz.
  - Javobni teskari amal bilan tekshiramiz.
  visual:
    type: array
    a: 7
    b: 8
    item: olma
worked_example:
  prompt: 63 ta yong‘oqni 7 ta likopchaga teng qilib qo‘yishdi. Har bir likopchada nechta yong‘oq?
  steps:
  - 'Teng tarqatish — bo‘lish: 63 : 7.'
  - '? × 7 = 63 — bu 9.'
  - 'Javob: har bir likopchada 9 ta yong‘oq.'
  answer: 9
misconceptions:
- code: COUNTING_SLIP
  description: 7, 8, 9 jadvallarida kichik xatolar.
  remedy: Qiyin ko‘paytmalar ro‘yxatini tuzib, har kuni 2–3 tasini takrorlash.
- code: WRONG_DIRECTION
  description: Masalada amalni noto‘g‘ri tanlaydi.
  remedy: Masalani rasm bilan chizish.
