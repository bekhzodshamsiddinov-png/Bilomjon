explanation:
  intro: Bo‘lish — hammasini teng qismlarga ajratish.
  steps:
  - '9 ta olmani 3 ta bolaga teng tarqatamiz: har biriga bittadan beramiz, olmalar tugaguncha.'
  - 'Har bir bolaga 3 tadan tegdi. Buni 9 : 3 = 3 deb yozamiz.'
  - 'Tekshiramiz: 3 × 3 = 9. Ko‘paytirish va bo‘lish — bir-biriga teskari amallar.'
  - 3 ga bo‘lishda 3 ning ko‘paytirish jadvalini eslash yordam beradi.
  visual:
    type: share
    a: 9
    b: 3
    item: olma
worked_example:
  prompt: 12 ta konfetni 3 ta bolaga teng bo‘lib berishdi. Har bir bolaga nechta konfet tegdi?
  steps:
  - 'Hammasi — 12 ta, 3 ta bolaga bo‘linadi: 12 : 3.'
  - 'Jadvalni eslaymiz: ? × 3 = 12. Bu son — 4.'
  - 'Javob: har bir bolaga 4 tadan konfet.'
  answer: 4
misconceptions:
- code: SUB_INSTEAD_OF_DIV
  description: '12 : 3 o‘rniga 12 − 3 = 9 deb hisoblaydi.'
  remedy: 'Buyumlarni haqiqatan tarqatib ko‘rsating: har bir guruhga bittadan.'
- code: MUL_INSTEAD_OF_DIV
  description: Bo‘lish o‘rniga ko‘paytiradi — natija kattalashib ketadi.
  remedy: “Bo‘lganda har bir qism hammasidan kichik bo‘ladi” degan qoidani misolda ko‘rsating.
- code: COUNTING_SLIP
  description: Tarqatishda yoki sanashda bittaga adashadi.
  remedy: Javobni ko‘paytirish bilan tekshirish odatini shakllantiring.
