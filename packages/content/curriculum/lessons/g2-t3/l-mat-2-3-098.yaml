parent_guide:
  teach_me:
  - 3 ga bo‘lish — hammasini 3 ta teng qismga ajratish va bitta qismda nechta borligini topish.
  - 'Bola avval buyumlarni tarqatib tushunsin, keyin jadvalga o‘tsin: 12 : 3 — “qaysi sonni 3 ga ko‘paytirsam 12 bo‘ladi?”'
  - Javobni ko‘paytirish bilan tekshirishni odat qiling — bu xatolarni o‘zi topishga o‘rgatadi.
  teach_child:
  - minutes: 1–2
    action: 6 ta mayda buyum va 3 ta likopcha (yoki qog‘ozdan doira) tayyorlang.
  - minutes: 3–5
    action: Farzandingiz buyumlarni likopchalarga bittadan tarqatsin va har birida nechta bo‘lganini aytsin.
  - minutes: 6–8
    action: 'Buyumlar sonini 9, keyin 12 taga oshiring. Har safar natijani “… : 3 = …” deb yozsin.'
  - minutes: 9–10
    action: 'Javobini ko‘paytirish bilan tekshirsin: “… × 3 = …”.'
  materials:
  - 12 tagacha mayda buyum
  - 3 ta likopcha yoki qog‘oz doira
  - qog‘oz va qalam
  watch_for:
  - Bo‘lish o‘rniga ayirishi
  - Tarqatishda guruhlar teng bo‘lmay qolishi
  - Javobni tekshirmasligi
