parent_guide:
  teach_me:
  - Masala yechishda eng muhimi — amalni to‘g‘ri tanlash. Hisoblash ikkinchi o‘rinda.
  - Bolaga “Bir xil guruhlar bormi? Teng tarqatyapmizmi? “Marta” so‘zi bormi?” degan savollarni bering.
  teach_child:
  - minutes: 1–3
    action: Bitta masalani o‘qing va farzandingiz uni rasm bilan chizsin (doiralar, chiziqlar).
  - minutes: 4–7
    action: Rasmga qarab amalni tanlab, hisoblasin; keyin teskari amal bilan tekshirsin.
  - minutes: 8–10
    action: 'Bir xil sonlar bilan ikkita masala tuzing: biri ko‘paytirish, biri bo‘lish uchun (masalan, 4, 6, 24).'
  materials:
  - qog‘oz va rangli qalam
  watch_for:
  - Masalani oxirigacha o‘qimasdan hisoblashga shoshilish
