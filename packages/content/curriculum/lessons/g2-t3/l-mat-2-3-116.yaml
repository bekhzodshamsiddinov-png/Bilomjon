objective: So‘zli masalada kerakli amalni (ko‘paytirish yoki bo‘lish) tanlash va yechimni izohlash.
success_criteria:
- Masalada nima berilgan va nima so‘ralayotganini aytadi.
- Teng guruhlar, teng tarqatish, “marta ko‘p/kam” vaziyatlarini taniydi.
- Javobini teskari amal bilan tekshiradi.
prior_knowledge:
- Ko‘paytirish jadvali
- “Marta ko‘p/kam” masalalari
