- javob
explanation:
  intro: Masala yechishning 4 qadami bor.
  steps:
  - '1) O‘qi va tasavvur qil: nima haqida gap ketyapti?'
  - 2) Nima ma’lum va nima so‘ralayapti?
  - '3) Amalni tanla: teng guruhlarni birlashtirish — ko‘paytirish; teng tarqatish — bo‘lish.'
  - 4) Hisobla va teskari amal bilan tekshir.
  visual:
    type: groups
    a: 4
    b: 6
    item: tuxum
worked_example:
  prompt: Bitta qutiga 6 ta tuxum sig‘adi. 4 ta qutida nechta tuxum bor?
  steps:
  - 'Ma’lum: 4 ta quti, har birida 6 tadan. So‘ralayapti: hammasi.'
  - 'Teng guruhlarni birlashtiramiz — ko‘paytirish: 4 × 6 = 24.'
  - 'Tekshiramiz: 24 : 4 = 6. Javob: 24 ta tuxum.'
  answer: 24
misconceptions:
- code: WRONG_DIRECTION
  description: Masaladagi sonlarni o‘ylamasdan ko‘paytiradi yoki bo‘ladi.
  remedy: Masalani rasm bilan chizdirib, keyin amal tanlash.
- code: ADD_INSTEAD_OF_MUL
  description: Sonlarni shunchaki qo‘shib yuboradi.
  remedy: “Bir xil guruhlar bormi?” degan savolni har safar berish.
