- Buyumlarni 8 ta teng guruhga tarqatib, bitta guruhdagi sonni topa oladi.
- 'Bo‘lishni ko‘paytirish bilan tekshiradi: ? × 8 = a.'
- Yangi so‘zli masalada bo‘lish kerakligini o‘zi aniqlaydi.
