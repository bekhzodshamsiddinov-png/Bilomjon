parent_guide:
  teach_me:
  - 8 ga bo‘lish — hammasini 8 ta teng qismga ajratish va bitta qismda nechta borligini topish.
  - 'Bola avval buyumlarni tarqatib tushunsin, keyin jadvalga o‘tsin: 32 : 8 — “qaysi sonni 8 ga ko‘paytirsam 32 bo‘ladi?”'
  - Javobni ko‘paytirish bilan tekshirishni odat qiling — bu xatolarni o‘zi topishga o‘rgatadi.
  teach_child:
  - minutes: 1–2
    action: 16 ta mayda buyum va 8 ta likopcha (yoki qog‘ozdan doira) tayyorlang.
  - minutes: 3–5
    action: Farzandingiz buyumlarni likopchalarga bittadan tarqatsin va har birida nechta bo‘lganini aytsin.
  - minutes: 6–8
    action: 'Buyumlar sonini 24, keyin 32 taga oshiring. Har safar natijani “… : 8 = …” deb yozsin.'
  - minutes: 9–10
    action: 'Javobini ko‘paytirish bilan tekshirsin: “… × 8 = …”.'
  materials:
