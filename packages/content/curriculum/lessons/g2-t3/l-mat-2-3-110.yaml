explanation:
  intro: Bo‘lish — hammasini teng qismlarga ajratish.
  steps:
  - '24 ta olmani 8 ta bolaga teng tarqatamiz: har biriga bittadan beramiz, olmalar tugaguncha.'
  - 'Har bir bolaga 3 tadan tegdi. Buni 24 : 8 = 3 deb yozamiz.'
  - 'Tekshiramiz: 3 × 8 = 24. Ko‘paytirish va bo‘lish — bir-biriga teskari amallar.'
  - 8 ga bo‘lishda 8 ning ko‘paytirish jadvalini eslash yordam beradi.
  visual:
    type: share
    a: 24
    b: 8
    item: olma
worked_example:
  prompt: 32 ta konfetni 8 ta bolaga teng bo‘lib berishdi. Har bir bolaga nechta konfet tegdi?
  steps:
  - 'Hammasi — 32 ta, 8 ta bolaga bo‘linadi: 32 : 8.'
  - 'Jadvalni eslaymiz: ? × 8 = 32. Bu son — 4.'
  - 'Javob: har bir bolaga 4 tadan konfet.'
  answer: 4
misconceptions:
- code: SUB_INSTEAD_OF_DIV
  description: '32 : 8 o‘rniga 32 − 8 = 24 deb hisoblaydi.'
  remedy: 'Buyumlarni haqiqatan tarqatib ko‘rsating: har bir guruhga bittadan.'
- code: MUL_INSTEAD_OF_DIV
  description: Bo‘lish o‘rniga ko‘paytiradi — natija kattalashib ketadi.
  remedy: “Bo‘lganda har bir qism hammasidan kichik bo‘ladi” degan qoidani misolda ko‘rsating.
- code: COUNTING_SLIP
  description: Tarqatishda yoki sanashda bittaga adashadi.
  remedy: Javobni ko‘paytirish bilan tekshirish odatini shakllantiring.
