- bo‘linma
- marta ko‘p
- marta kam
explanation:
  intro: Bugun o‘rganganlarimizni takrorlaymiz.
  steps:
  - 'Teng guruhlar → ko‘paytirish: 4 ta guruh, har birida 3 tadan = 4 × 3.'
  - 'Teng tarqatish → bo‘lish: 15 tani 5 ga bo‘lsak = 15 : 5.'
  - “Marta ko‘p” → ko‘paytirish, “marta kam” → bo‘lish.
  - 'Har doim tekshir: bo‘lishni ko‘paytirish bilan, ko‘paytirishni bo‘lish bilan.'
  visual:
    type: array
    a: 4
    b: 3
    item: olma
worked_example:
  prompt: 20 ta gulni 4 ta guldonga teng qilib qo‘yishdi. Har bir guldonda nechta gul bor?
  steps:
  - 'Teng tarqatish — bo‘lish: 20 : 4.'
  - '? × 4 = 20 — bu 5.'
  - 'Javob: har bir guldonda 5 ta gul.'
  answer: 5
