  description: Ko‘paytirish va bo‘lishni adashtiradi.
  remedy: 'Masalani rasm bilan chizdiring: guruhlar berilganmi yoki hammasi?'
- code: ADD_INSTEAD_OF_TIMES
  description: “Marta” va “ta” iboralarini adashtiradi.
  remedy: 103–104-darslardagi buyumlar o‘yinini takrorlang.
