objective: 3, 4, 5 ga ko‘paytirish va bo‘lish hamda “marta ko‘p/kam” masalalarini mustaqil yechish.
success_criteria:
- 3, 4, 5 ning jadvalidagi ko‘paytirish va bo‘lish misollarini yechadi.
- So‘zli masalada kerakli amalni tanlaydi.
- Javobini teskari amal bilan tekshiradi.
