objective: Son berilgan songa qoldiqsiz bo‘linishini tekshirish; bo‘luvchi va karrali tushunchalarini oddiy misollarda farqlash.
success_criteria:
- Son berilgan songa qoldiqsiz bo‘linishini teng guruhlar yoki jadval orqali tekshiradi.
- '“3 ga karrali sonlar” qatorini davom ettira oladi: 3, 6, 9, 12 …'
- Javobini izohlaydi (ortib qolgan bormi?).
