explanation:
  intro: Ba’zi sonlar teng guruhlarga bo‘linadi, ba’zilarida esa ortib qoladi.
  steps:
  - '12 ta olmani 3 ta guruhga ajratamiz: har birida 4 ta, ortib qolmadi. 12 soni 3 ga qoldiqsiz bo‘linadi.'
  - 3 — 12 ning bo‘luvchisi. 12 esa 3 ga karrali son.
  - 13 ta olmani 3 guruhga ajratsak — 4 tadan, 1 ta ortib qoladi. 13 soni 3 ga qoldiqsiz bo‘linmaydi.
  - '3 ga karrali sonlar — 3 tadan sanaganda chiqadigan sonlar: 3, 6, 9, 12, 15 …'
  visual:
    type: share
    a: 12
    b: 3
    item: olma
worked_example:
  prompt: 20 soni 4 ga qoldiqsiz bo‘linadimi? 4 tadan nechta guruh chiqadi?
  steps:
  - '4 tadan sanaymiz: 4, 8, 12, 16, 20 — 20 qatorda bor.'
  - Demak, 20 soni 4 ga qoldiqsiz bo‘linadi.
  - '4 tadan 5 ta guruh chiqadi: 20 : 4 = 5.'
  answer: 5
