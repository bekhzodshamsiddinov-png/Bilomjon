parent_guide:
  teach_me:
  - 'Agar son teng guruhlarga ortiqchasiz bo‘linsa — “qoldiqsiz bo‘linadi”: 12 : 3 = 4.'
  - “Bo‘luvchi” — bo‘ladigan son (3), “karrali” — bo‘linadigan son (12). Bu so‘zlarni bola darhol eslab qolmasa ham bo‘ladi — asosiysi, tekshira
    olishi.
  teach_child:
  - minutes: 1–3
    action: 15 ta buyumni 4 guruhga ajratishga urinib ko‘ring — ortib qoladimi? Keyin 3 guruhga.
  - minutes: 4–7
    action: Turli sonlar bilan (12, 14, 16, 18) “2 ga, 3 ga bo‘linadimi?” o‘yinini o‘ynang — har safar buyum bilan tekshirsin.
  - minutes: 8–10
    action: 5 tadan sanab, 50 gacha bo‘lgan 5 ga karrali sonlarni yozsin.
