objective: 'Ko‘paytirish va bo‘lish teskari amallar ekanini tushunish: bitta ko‘paytirish tengligidan ikkita bo‘lish tengligini hosil qilish.'
success_criteria:
- 'a × b = c dan c : b = a va c : a = b ni yoza oladi.'
- Bo‘lishni ko‘paytirish bilan tekshiradi.
- Noma’lum ko‘paytuvchini bo‘lish orqali topadi.
