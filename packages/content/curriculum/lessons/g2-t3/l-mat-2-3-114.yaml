explanation:
  intro: 'Ko‘paytirish va bo‘lish — bir oila: biri ikkinchisini tekshiradi.'
  steps:
  - '3 ta qatorda 5 tadan olma: 3 × 5 = 15.'
  - 'Endi 15 ta olmani 3 qatorga bo‘lsak — har qatorda 5 ta: 15 : 3 = 5.'
  - '15 ta olmani 5 tadan guruhlasak — 3 ta guruh: 15 : 5 = 3.'
  - 'Bitta ko‘paytirishdan ikkita bo‘lish chiqadi. Bu “sonlar uchligi”: 3, 5, 15.'
  visual:
    type: array
    a: 3
    b: 5
    item: olma
worked_example:
  prompt: '6 × 4 = 24. Shundan foydalanib 24 : 6 ni toping.'
  steps:
  - 24 — ko‘paytma, 6 va 4 — ko‘paytuvchilar.
  - Ko‘paytmani bitta ko‘paytuvchiga bo‘lsak, ikkinchisi chiqadi.
  - '24 : 6 = 4.'
  answer: 4
