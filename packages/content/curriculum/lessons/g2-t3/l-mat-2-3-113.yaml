parent_guide:
  teach_me:
  - 'Jadvalni tushunib yodlash: avval 2, 5, 10 (eng oson), keyin 3, 4, so‘ng 6–9.'
  - 'O‘rin almashtirish xossasi yodlash hajmini ikki baravar kamaytiradi: 3 × 8 = 8 × 3.'
  - Unutilgan ko‘paytmani yaqin ko‘paytmadan topishni o‘rgating — bu yodlashdan ham muhim ko‘nikma.
  teach_child:
  - minutes: 1–3
    action: Qog‘ozga 10×10 katakli jadval chizing; farzandingiz bilgan ko‘paytmalarini to‘ldirsin.
  - minutes: 4–7
    action: Bo‘sh qolgan kataklarni o‘rin almashtirish yoki yaqin ko‘paytma orqali birga to‘ldiring.
  - minutes: 8–10
    action: Eng qiyin 3 ta ko‘paytmani tanlab, ularni ertaga yana so‘rashga kelishing.
