explanation:
  intro: Ko‘paytirish jadvali — barcha o‘rgangan ko‘paytirishlarimiz bitta katta jadvalda.
  steps:
  - 'Jadvalda qatorlar va ustunlar bor: 6-qator va 7-ustun kesishgan joyda 6 × 7 = 42 turadi.'
  - 'O‘rin almashtirish yordam beradi: 7 × 6 ham 42. Shuning uchun jadvalning yarmini bilsak, qolganini ham bilamiz.'
  - 'Unutib qo‘ysang — yaqin ko‘paytmadan foydalan: 6 × 7 = 6 × 6 + 6 = 36 + 6.'
  - '9 ning jadvali sirli: 9 × 3 = 27 — raqamlar yig‘indisi 2 + 7 = 9.'
  visual:
    type: array
    a: 6
    b: 7
    item: olma
worked_example:
  prompt: 7 × 8 ni unutib qo‘ysang, qanday topasan?
  steps:
  - 'Yaqin ko‘paytmani eslaymiz: 7 × 7 = 49.'
  - '7 × 8 — bu yana bitta 7 ko‘p: 49 + 7 = 56.'
  - 'Javob: 7 × 8 = 56.'
  answer: 56
misconceptions:
- code: GROUP_COUNT_OFF
  description: Yaqin ko‘paytmadan foydalanganda bitta guruhni noto‘g‘ri qo‘shadi yoki ayiradi.
  remedy: Qaysi son necha marta takrorlanayotganini ovoz chiqarib aytdiring.
- code: COUNTING_SLIP
  description: 6, 7, 8 jadvallarida kichik xatolar.
  remedy: Kuniga 5 daqiqa, 3–4 ta qiyin ko‘paytma bilan qisqa mashq.
